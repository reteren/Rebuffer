[package]
name = "rebuffer"
# The shipping version, and its only home: every installer takes the next
# unused one (tools/build_native_installer.py refuses to reuse a version).
version = "1.2.8"
description = "Persistent clipboard history for Windows"
authors = ["reteren"]
edition = "2021"
publish = false

[[bin]]
name = "rebuffer"
path = "src/main.rs"

[dependencies]
rebuffer-core = { path = "../core" }
# Slint under its Royalty-free license, which asks the app to say it uses
# Slint (AboutSlint in the About panel). Software renderer only: it idled at
# 12.6 MB in the phase-1 spike where femtovg cost ~70 MB of GL driver memory.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-software",
    "renderer-femtovg",
    "accessibility",
    "unstable-winit-030",
    "raw-window-handle-06",
] }
tray-icon = "0.26.1"
raw-window-handle = "0.6"
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde_json = "1.0.151"
rfd = "0.18.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "unstable-locales"] }
tracing = "0.1.44"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Foundation", "Data_Xml_Dom", "UI_Notifications", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL"] }

[build-dependencies]
slint-build = "1.18.1"
