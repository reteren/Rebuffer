# Rebuffer: the core library and the native (Slint) app.
#
# The shipping version is the `version` of native/Cargo.toml, and only that:
# the About panel, the installer file name and the installer's own version
# metadata all read it.
[workspace]
resolver = "2"
members = ["core", "native"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
