[package]
name = "rebuffer"
version = "1.1.11"
description = "Persistent clipboard history for Windows"
authors = ["reteren"]
edition = "2021"
rust-version = "1.82"

[workspace]
# The core builds and tests without Tauri; the native front end will join it
# here. `default-members` keeps plain `cargo test` / `cargo clippy` covering
# both, as they did when this was one crate.
members = ["core", "native"]
default-members = [".", "core", "native"]

[lib]
name = "rebuffer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rebuffer-core = { path = "core" }
arboard = "3.6.1"
image = { version = "0.25.6", features = ["png", "jpeg", "gif", "webp", "bmp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1.44"
tracing-appender = "0.2.5"
urlencoding = "2.1.3"
window-vibrancy = "0.8.0"
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_System_Registry", "Win32_Security"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

